# Video Treasure behind Nginx (the local Docker Compose demo). One origin serves the built frontend and proxies
# /api to three API containers, so the auth cookies are first-party instead of cross-site.

upstream video_treasure_api {
    # Each request goes to the API container with the fewest active connections.
    least_conn;
    # A container that fails is skipped for 10 s.
    server api1:8000 max_fails=1 fail_timeout=10s;
    server api2:8000 max_fails=1 fail_timeout=10s;
    server api3:8000 max_fails=1 fail_timeout=10s;
}

# Search is the expensive route: 5 requests a second per client IP, bursts of up to 10.
limit_req_zone $binary_remote_addr zone=search_per_ip:10m rate=5r/s;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Inherited by both /api locations.
    proxy_http_version 1.1;
    # $http_host keeps the port, so Passport builds http://localhost:8080/... OAuth callbacks.
    proxy_set_header Host $http_host;
    # The API trusts exactly one proxy hop (TRUST_PROXY_HOPS=1), so req.ip is the visitor's address.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Behind TLS this says "https"; without it, the Google OAuth callback would be built as http.
    proxy_set_header X-Forwarded-Proto $scheme;
    # A stopped or failing container: send the request to the next one. A stopped container's address may not
    # refuse the connection but just time out, so fail over after 2 s instead of the default 60.
    proxy_next_upstream error timeout http_502 http_503;
    proxy_connect_timeout 2s;

    location /api/v1/videos/search {
        limit_req zone=search_per_ip burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://video_treasure_api;
    }

    location /api/ {
        proxy_pass http://video_treasure_api;
    }

    # React Router owns every other path (the same rewrite as Frontend/vercel.json).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
